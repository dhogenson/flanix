[workspace]
resolver = "2"
members = [
    "crates/sync-core",
    "crates/sync-cli",
    "crates/sync-config",
    "crates/sync-errors"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tokio = {version = "1.53.1", features = ["full"]}
anyhow = "1.0.104"
uuid = {version = "1.24.0", features = ["v4"] }
thiserror = "2.0.20"
aws-sdk-s3 = "1.141.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "migrate", "chrono"] }
glob = "0.3.4"
serde = "1.0.229"
serde_json = "1.0.151"
